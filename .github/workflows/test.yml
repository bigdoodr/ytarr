name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: YTArr
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: YTArr/.build
          key: spm-${{ runner.os }}-${{ hashFiles('YTArr/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
